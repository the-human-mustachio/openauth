name: test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned deliberately. `latest` silently moved CI from Bun 1.1
          # to 1.4, which dropped the legacy OpenSSL `RSA-SHA256` digest
          # alias that node-saml needs to resolve a SigAlg URI, so the
          # SAML redirect-binding tests failed on Bun alone — CI was red
          # for two releases before the cause was found. Bump on purpose.
          bun-version: 1.4.2
      - run: bun install
      - run: cd packages/openauth && bun run build
      # `bun test` strips types without checking them, so the test tree
      # can drift out of sync with `src` while staying green. This is the
      # only thing that catches that.
      - run: cd packages/openauth && bun run typecheck
      - run: cd packages/openauth && bun test
