name: test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned deliberately. `latest` silently moved CI from Bun 1.1
          # to 1.4, which changed URL query re-encoding and broke SAML
          # redirect-binding signature verification — CI was red for two
          # releases before anyone noticed. Bump this on purpose.
          bun-version: 1.4.2
      - run: bun install
      - run: cd packages/openauth && bun run build
      - run: cd packages/openauth && bun test
