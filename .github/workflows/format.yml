name: format

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  format:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned deliberately. `latest` silently moved CI from Bun 1.1
          # to 1.4, which dropped the legacy OpenSSL `RSA-SHA256` digest
          # alias that node-saml needs to resolve a SigAlg URI, so the
          # SAML redirect-binding tests failed on Bun alone — CI was red
          # for two releases before the cause was found. Bump on purpose.
          bun-version: 1.4.2
      - run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          ./scripts/format
