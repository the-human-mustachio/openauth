name: format

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  format:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned deliberately. `latest` silently moved CI from Bun 1.1
          # to 1.4, which changed URL query re-encoding and broke SAML
          # redirect-binding signature verification — CI was red for two
          # releases before anyone noticed. Bump this on purpose.
          bun-version: 1.4.2
      - run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          ./scripts/format
